<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduccion a CSS</title>
</head>
<body>
    <!--  1. CSS dentro del elemento <style>...</style> -->
      <style>
      
     h1{
       color: rgb(230, 188, 18);
       font-size: 48px
    }
      
      </style>
    <h1>Introduccion a CSS</h1>
    <!-- 2. Escribimos CSS en linea. Dentro de la esquina de apertura de un elemento de html-->
    
    <p style="color: rgba(255, 183, 0, 0.907); font-size: 48px;" >Lorem ipsum, dolor sit amet consectetur adipisicing elit. Fugiat, odit a. Nulla eaque officia, dolorum debitis fugiat blanditiis sed dolore totam sint labore mollitia veritatis doloribus nemo ducimus amet deserunt.</p>

    <!-- 3. Escribimos CSS es un documento externo y lo llamamosa traves de el elemento link -->

    <h2>CSS externo</h2>
    <link rel="stylesheet" href="./style.css">
</body>
</html>
